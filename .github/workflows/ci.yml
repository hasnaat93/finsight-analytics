name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FINSIGHT_DATABASE_URL: postgresql://finsight:finsight@localhost:5432/finsight
  FINSIGHT_TEST_DATABASE_URL: postgresql://finsight:finsight@localhost:5432/finsight_test

jobs:
  pipeline:
    name: Lint, tests, full pipeline and SQL assertions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finsight
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: finsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finsight -d finsight" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: make install
      - name: Create the test database
        run: PGPASSWORD=finsight psql -h localhost -U finsight -d finsight -c "create database finsight_test"
      - name: Lint and tests (unit, plus integration on PostgreSQL)
        run: make test
      - name: Generate three years of source data
        run: make generate SCALE=0.4
      - name: Load the warehouse
        run: make init etl
      - name: SQL assertions
        run: make test-sql
      - name: Warehouse status
        run: make status
      - name: Reloading a batch changes nothing
        run: |
          python -m etl.run_pipeline run --batch 2025-06 --reload
          make test-sql
      - name: Build the web preview
        run: make dashboard
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    name: Publish the web preview to GitHub Pages
    needs: pipeline
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

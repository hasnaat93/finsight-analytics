[project]
name = "finsight-analytics"
version = "1.0.0"
description = "Financial performance and operations intelligence: Python ETL, PostgreSQL star schema, Power BI semantic model"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
